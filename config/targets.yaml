# One entry per site you want to scrape. Add as many as you need —
# run_full_crawl() fans every entry here out as its own Celery task.
#
# `fields` maps output_key -> css_selector. Append '::attr(name)' to a
# selector to pull an HTML attribute instead of text content.

targets:
  - name: tofler
    base_url: "https://www.tofler.in"
    start_urls: []
    list_item_selector: ""
    fields: {}
    company_wait_for_selector: "body"
    company_fields:
      company_name: "COMPANY_NAME"
      cin: "CIN"
      status: "STATUS"
      registered_address: "REGISTERED_ADDRESS"
      authorized_capital: "AUTHORIZED_CAPITAL"
      paid_up_capital: "PAID_UP_CAPITAL"
      industry: "INDUSTRY"
      email: "EMAIL"
      directors: "DIRECTORS_TABLE"
      date_of_incorporation: "DATE_OF_INCORPORATION"
      company_class: "COMPANY_CLASS"
      company_category: "COMPANY_CATEGORY"
      company_sub_category: "COMPANY_SUB_CATEGORY"
      roc: "ROC"
      listing_status: "LISTING_STATUS"
      registered_office_address: "REGISTERED_OFFICE_ADDRESS"
      nic_code: "NIC_CODE"
      nic_description: "NIC_DESCRIPTION"
      last_agm_date: "LAST_AGM_DATE"
      last_balance_sheet_date: "LAST_BALANCE_SHEET_DATE"
    wait_for_selector: ""
    rate_limit_seconds: 2

  # - name: another_site
  #   start_urls:
