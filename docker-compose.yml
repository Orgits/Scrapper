# Production Docker Compose for Web Scraper System
# =============================================================================
# Services:
#   - redis: Redis broker/result backend with persistence
#   - worker: Celery worker for scraping tasks
#   - beat: Celery beat scheduler for periodic tasks
#   - flower: Celery monitoring UI
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Persistent data volumes
      - ./data:/app/data
      - ./logs:/app/logs
      - ./companydata:/app/companydata:ro
      # Proxy list (if not baked into image)
      - ./proxyscrape_premium_http_proxies.txt:/app/proxyscrape_premium_http_proxies.txt:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
    # Health check via Flower API or custom endpoint
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.from_url('redis://localhost:6379/0'); r.ping(); print('OK')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  beat:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./companydata:/app/companydata:ro
    command: ["celery", "-A", "workers.celery_worker", "beat", "--loglevel=info"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  flower:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "5555:5555"
    volumes:
      - ./data:/app/data
    command: ["celery", "-A", "workers.celery_worker", "flower", "--port=5555"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  redis_data:
    driver: local
  data:
    driver: local
  logs:
    driver: local

# Network configuration
networks:
  default:
    name: scraper-network